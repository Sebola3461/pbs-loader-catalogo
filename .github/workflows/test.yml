name: Testes

# pull_request (sem segredos, token só de leitura): roda o código do PR, então só serve para PRs que mexem nos
# scripts, que um mantenedor revisa antes do merge.
on:
  pull_request:
    paths: ['scripts/**', 'schema/**', 'tests/**', 'package.json', 'package-lock.json']
  push:
    branches: [main]
    paths: ['scripts/**', 'schema/**', 'tests/**', 'package.json', 'package-lock.json']

permissions:
  contents: read

jobs:
  testes:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - run: npm ci --ignore-scripts
      - run: npm test
